<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Copa Desafío</title>
<meta name="description" content="Organizá el partido de la semana">
<meta name="theme-color" content="#1b5e37">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Copa Desafío">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" href="icono-180.png">
<link rel="manifest" href="manifest.webmanifest">

<style>
@font-face { font-family: Barlow; src: url(Barlow-Regular.ttf); }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1b5e37; overscroll-behavior: none; }
body { position: fixed; inset: 0; font-family: Barlow, system-ui, sans-serif; color: #f3f8f1; }
#canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none;
	-webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.campo, .compartir, .avisos, .foto { position: fixed; box-sizing: border-box; margin: 0; border: 0; border-radius: 10px;
	-webkit-appearance: none; appearance: none; }
.campo { resize: none; padding-top: 8px; background: #fff; color: #0e2a1a; font-family: Barlow, system-ui, sans-serif; outline: none; }
.campo:focus { box-shadow: 0 0 0 3px #1b5e37; }
.campo::placeholder { color: #6b806f; opacity: 1; }
.compartir, .avisos { background: transparent; }
.foto { opacity: 0; cursor: pointer; }
.compartir:focus-visible, .avisos:focus-visible { box-shadow: inset 0 0 0 3px #0e2a1a; }
#carga { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 20px; align-items: center;
	justify-content: center; background: #1b5e37; padding: 24px; text-align: center; font-size: 18px; }
#carga b { font-size: 34px; }
#barra { width: 220px; height: 8px; background: rgba(243, 248, 241, .25); border-radius: 4px; overflow: hidden; }
#barra div { width: 0; height: 100%; background: #ffd23f; }
</style>
</head>
<body>
<canvas id="canvas">Tu navegador no puede abrir la app.</canvas>
<div id="carga"><b>Copa Desafío</b><div id="barra"><div></div></div><span id="mensaje">Cargando…</span></div>
<script src="index.js"></script>
<script>
(function () {
	const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":530156,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
	const carga = document.getElementById('carga');
	const mensaje = document.getElementById('mensaje');
	const relleno = document.querySelector('#barra div');
	function fallar(texto) {
		mensaje.textContent = texto;
		document.getElementById('barra').style.display = 'none';
	}
	const faltan = Engine.getMissingFeatures({ threads: false });
	if (faltan.length) {
		fallar('Este navegador es muy viejo para abrir la app. Actualizalo o probá con otro.');
		return;
	}
	new Engine(config).startGame({
		onProgress: function (actual, total) {
			if (total > 0) relleno.style.width = Math.round(100 * actual / total) + '%';
		},
	}).then(function () { carga.remove(); }, function (e) {
		console.error(e);
		fallar('No se pudo abrir. Revisá internet y recargá la página.');
	});
})();
</script>
</body>
</html>
